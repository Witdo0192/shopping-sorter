<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 220px;
      padding: 15px;
      font-family: -apple-system, sans-serif;
      margin: 0;
      background: #f8f9fa;
    }

    button {
      width: 100%;
      padding: 12px;
      margin: 5px 0;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      font-size: 14px;
    }

    .open {
      background: #4CAF50;
      color: white;
    }

    h3 {
      margin: 0 0 15px 0;
      color: #333;
      text-align: center;
    }

    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin: 0 0 15px 0;
    }

    .header-row h3 {
      margin: 0;
      text-align: left;
    }

    #status {
      text-align: center;
      padding: 10px;
      color: #666;
      font-size: 13px;
    }

    .settings-row {
      display: flex;
      gap: 6px;
      margin: 5px 0;
    }

    .settings-row button {
      margin: 0;
    }

    #settings {
      flex: 1;
    }

    #selectors {
      flex: 0 0 46px;
      width: 46px;
      padding: 0;
      font-size: 20px;
      line-height: 1;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 4px;
      font-size: 13px;
      color: #444;
      border-top: 1px solid #e0e0e0;
      margin-top: 8px;
    }

    .toggle-row input {
      cursor: pointer;
    }

    .toggle-row label {
      cursor: pointer;
      flex: 1;
    }

    .switch {
      position: relative;
      width: 42px;
      height: 24px;
      flex: 0 0 auto;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; inset: 0; cursor: pointer;
      background: #bdbdbd; border-radius: 24px; transition: .18s;
    }
    .slider:before {
      content: ''; position: absolute; width: 18px; height: 18px;
      left: 3px; top: 3px; background: white; border-radius: 50%;
      box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: .18s;
    }
    .switch input:checked + .slider { background: #4CAF50; }
    .switch input:checked + .slider:before { transform: translateX(18px); }
  </style>
</head>

<body>
  <div class="header-row">
    <h3>🛒 Shopping фильтр</h3>
    <label class="switch" title="Временно включить или выключить обработку страницы">
      <input type="checkbox" id="extensionEnabledToggle">
      <span class="slider"></span>
    </label>
  </div>
  <div id="extensionStatusLabel" style="text-align:right; font-size:11px; color:#888; margin:-11px 0 10px;"></div>
  <div class="settings-row">
    <button id="settings">⚙️ Настройки</button>
    <button id="selectors" type="button" title="Настройка селекторов карточек товаров">🎯</button>
  </div>
  <button id="open" class="open">📦 Открыть товары</button>
  <div id="status"></div>
  <div class="toggle-row">
    <input type="checkbox" id="liveCounterToggle">
    <label for="liveCounterToggle">🔎 Показывать счётчик найденных карточек на странице</label>
  </div>
  <script src="popup.js"></script>
</body>

</html>
